<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B-Clim@tik 1.2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: outil de terrain pour techniciens froid et clim, direct, en français.
   IDEA: le carnet d'intervention et le manifold : marine = la base, orange = l'action, bleu BP / rouge HP.
   PICTURE: la fiche code ouverte (voyants animés, étapes numérotées) et le cadran du manomètre dans Outils.
   COLOUR and TYPE: charte B-Form@tik marine #13294b / orange #f47b20 ; Baloo 2 pour les titres, Nunito pour le texte.
   LAYOUT: barre d'appli + onglets défilants ; une colonne sur téléphone, deux colonnes (liste / fiche) au-delà de 960 px. */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5f9,#0a1424);--paper:light-dark(#ffffff,#11203a);--ink:light-dark(#13294b,#e8eef8);--mut:light-dark(#56657d,#9fb0c8);
--line:light-dark(#dde3ec,#243755);--soft:light-dark(#eef2f8,#172a47);--navy:#13294b;--or:#f47b20;--orl:light-dark(#fff0e4,#3a2412);
--ok:#1b8a59;--okl:light-dark(#e2f4ea,#12331f);--bad:#c8372d;--badl:light-dark(#fde8e6,#3b1714);--bp:#1f6fd1;--hp:#d23b2f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Baloo 2",Nunito,sans-serif;line-height:1.08;margin:0;text-wrap:balance}
h2{font-size:clamp(24px,3vw,32px)}h3{font-size:19px}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.hidden{display:none!important}
/* barre */
.appbar{background:var(--navy);color:#fff;padding:10px max(3vw,14px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:"Baloo 2";font-weight:800;font-size:24px;line-height:1}.brand b{color:var(--or)}
.ver{font-size:13px;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:999px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.who .pill{background:var(--or);color:#fff;font-weight:800;border-radius:999px;padding:3px 10px}
.who .exp{color:#c8d3e6}
.demo-switch{background:light-dark(#fff7ee,#2a1d0f);border-bottom:1px solid var(--line);padding:8px max(3vw,14px);display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.demo-switch select{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);padding:4px 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px max(3vw,14px);background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.tab{flex:none;min-height:44px;border:0;border-radius:12px;padding:8px 14px;background:var(--soft);font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px}
.tab.on{background:var(--navy);color:#fff}
.tab .n{background:var(--or);color:#fff;border-radius:999px;font-size:13px;padding:0 7px}
main{padding:16px max(3vw,14px) 60px;max-width:1280px;margin:0 auto}
.screen-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.screen-head .sub{color:var(--mut);margin:4px 0 0}
.screen-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.accent{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.accent svg{width:24px;height:24px}
.btn{min-height:44px;border-radius:12px;border:0;padding:8px 16px;font-weight:800;background:var(--or);color:#fff}
.btn.sec{background:var(--soft);color:var(--ink)}.btn.navy{background:var(--navy);color:#fff}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:960px){.grid2{grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr)}.grid2 .detail{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}}
label.f{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:8px 12px}
textarea.inp{min-height:110px}
.big-search{display:flex;gap:8px}.big-search .btn{flex:none}.big-search .inp{flex:1 1 0;width:auto}.big-search .inp{font-size:20px;font-weight:800;letter-spacing:.02em}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:6px 14px;font-weight:700}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chips button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:6px 10px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;line-height:1.2}
.chips button .c{flex:none;min-width:26px;text-align:center;font-size:13px;border-radius:999px;padding:1px 7px;background:var(--soft);color:var(--mut)}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.chips button.on .c{background:var(--or);color:#fff}
.chips button:hover{border-color:var(--or)}
@media(max-width:600px){.chips{grid-template-columns:repeat(2,minmax(0,1fr))}.chips button{font-size:14px;padding:6px 8px;hyphens:auto;overflow-wrap:anywhere}}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.err{color:var(--bad);font-weight:700;font-size:14px;margin-top:4px}
.invite{text-align:center;padding:34px 14px;color:var(--mut)}
.invite svg{width:64px;height:64px;color:var(--or)}
.note-box{background:var(--orl);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.lock{background:var(--soft);border-radius:12px;padding:12px;color:var(--mut);font-size:14px}
/* cartes */
.group-h{font-family:"Baloo 2";font-weight:700;font-size:18px;margin:16px 0 6px}
.group-h small{font-family:Nunito;color:var(--mut);font-weight:600;font-size:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;display:block;width:100%;text-align:left;color:inherit}
.card:hover{border-color:var(--or)}
.card.sel{border:2px solid var(--or)}
.card .top{display:flex;gap:10px;align-items:flex-start}
.code{flex:none;font-family:"Baloo 2";font-weight:800;font-size:19px;background:var(--or);color:#fff;border-radius:10px;padding:2px 10px;line-height:1.4;white-space:nowrap}
.code.veille{background:#6d7a90}.code.proc{background:var(--navy)}
.card .t{font-weight:800}.card .m{color:var(--mut);font-size:14px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bdg{font-size:13px;font-weight:700;border-radius:12px;padding:2px 9px;background:var(--soft);white-space:normal;overflow-wrap:anywhere;max-width:100%}
.badges .lire{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;font-size:13px;font-weight:700}
.bdg.ok{background:var(--okl);color:var(--ok)}.bdg.av{background:var(--orl);color:light-dark(#a9520f,#f9b27a)}.bdg.bad{background:var(--badl);color:var(--bad)}
/* fiche */
.detail h3{margin-top:14px}
.dhead{display:flex;gap:12px;align-items:flex-start}
.dhead .code{font-size:26px}
.meta{color:var(--mut);font-size:14px;margin-top:4px}
.box{border-radius:12px;padding:12px;margin:12px 0}
.box.read{background:light-dark(#e9f1fd,#13294b);}
.box.led{background:var(--soft)}
.steps{list-style:none;margin:8px 0;padding:0}
.steps li{display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.steps .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
:root[data-theme=dark] .steps .num{background:#3d5f97}
.steps .txt{padding-top:2px;white-space:pre-line}
.steps li.sub{font-family:"Baloo 2";font-weight:700;font-size:17px;margin-top:14px}
.steps li.pt .num{background:transparent;color:var(--or);width:28px}
.steps input[type=checkbox]{flex:none;width:24px;height:24px;min-width:24px;margin:2px 0 0;accent-color:var(--ok)}
.steps li.nochk{padding-left:34px}
.steps li.done .txt{text-decoration:line-through;color:var(--mut)}
.pre{white-space:pre-line}
.leds{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
.ledw{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;text-align:center;max-width:120px}
.dot{width:26px;height:26px;border-radius:50%;background:#9aa6b8;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.dot.on{background:var(--c,#2fbf5b)}
@media(prefers-reduced-motion:no-preference){.dot.blink{animation:bl var(--d,.5s) steps(1) infinite}@keyframes bl{0%{background:var(--c,#2fbf5b)}50%{background:#9aa6b8}}}
.dot.blink{background:var(--c,#2fbf5b)}
.links .card{padding:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
/* tableaux */
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mut)}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.chg td{background:var(--orl)}
.scroll{overflow-x:auto}
/* schémas */
.vign{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.vg{border-radius:14px;border:1px solid var(--line);background:var(--paper);padding:0;overflow:hidden;text-align:left;color:inherit}
.vg .im{aspect-ratio:4/3;background:var(--soft);display:grid;place-items:center;color:var(--mut)}
.vg .im svg{width:70%;height:70%}
.vg .lb{padding:8px 10px;font-weight:800;font-size:14px}
.vg .lb small{display:block;font-weight:600;color:var(--mut)}
/* outils */
.tool{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:900px){.tool{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}}
.result{font-family:"Baloo 2";font-weight:800;font-size:clamp(40px,7vw,64px);line-height:1}
.result small{font-size:20px}
.diag{border-radius:12px;padding:10px 12px;font-weight:700;margin-top:8px}
.gauge{width:100%;max-width:330px;aspect-ratio:1;display:block;margin:0 auto}
.flu{display:flex;gap:6px;flex-wrap:wrap}
.flu button{min-height:40px;min-width:68px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:800}
.flu button.on{background:var(--navy);color:#fff}
.side-bp.on{background:var(--bp)!important;border-color:var(--bp)!important}.side-hp.on{background:var(--hp)!important;border-color:var(--hp)!important}
tr.near td{background:var(--orl);font-weight:800}
/* modale */
.modal{position:fixed;inset:0;background:rgba(6,14,28,.55);display:grid;place-items:center;z-index:50;padding:12px}
.modal .in{background:var(--paper);border-radius:18px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.modal .in h2{margin-bottom:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs figure{margin:0;width:96px;font-size:12px;text-align:center}
.thumbs img{width:96px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs button{font-size:12px;border:0;background:none;color:var(--bad);text-decoration:underline;min-height:28px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:60;max-width:92vw}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--or);animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.cmp div{background:var(--soft);border-radius:10px;padding:8px;font-size:14px;white-space:pre-line}
.cmp .chg{background:var(--orl)}
footer{color:var(--mut);font-size:13px;text-align:center;padding:18px}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:2px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mut);font-size:13px}.stack td:empty{display:none}.cmp{grid-template-columns:minmax(0,1fr)}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<style>
#liveGate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:20px}
#liveGate[hidden],#liveApp[hidden]{display:none}
.lg{width:min(380px,100%);background:var(--card);border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.lg h1{font-size:28px;margin:0 0 4px}.lg h1 b{color:var(--or,#f47b20)}
.lg label{display:block;font-weight:700;margin:12px 0 4px}.lg input{width:100%;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.lg button{margin-top:16px;width:100%;min-height:44px}.lg .lnk{background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;margin-top:10px;font-size:14px}
#lgMsg{min-height:1.4em;margin-top:12px;color:var(--mut)}
</style>
<div id="liveGate">
 <div class="lg">
  <h1>B-Clim<b>@</b>tik</h1><p style="margin:0;color:var(--mut)">Diagnostic pannes — version 1.2.0</p>
  <form id="lgForm" autocomplete="on">
   <label for="lgEmail">Nom d'utilisateur</label><input id="lgEmail" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ex. J97139bour" required>
   <label for="lgPw">Mot de passe</label><input id="lgPw" type="password" autocomplete="current-password" required>
   <button id="lgBtn" class="btn" type="submit">Se connecter</button>
   <button id="lgReset" class="lnk" type="button">Mot de passe perdu ? Demander un nouveau mot de passe (2,95 €)</button>
  </form>
  <form id="lgNew" hidden>
   <label for="np1">Nouveau mot de passe</label><input id="np1" type="password" autocomplete="new-password">
   <label for="np2">Confirmer</label><input id="np2" type="password" autocomplete="new-password">
   <button class="btn" type="submit">Enregistrer</button>
  </form>
  <p id="lgMsg" role="status"></p>
 </div>
</div>
<div id="liveApp" hidden>
<header class="appbar">
  <div class="brand">B-Clim<b>@</b>tik</div><span class="ver">version 1.2.0</span>
  <div class="who" id="who"></div>
</header>
<div class="demo-switch" id="demoSwitch">
  <b>Mode présentation</b> — profil affiché :
  <select id="profileSel" aria-label="Profil affiché">
    <option value="demo">Démo (48 h)</option>
    <option value="technicien">Technicien</option>
    <option value="super_technicien">Super Technicien</option>
    <option value="responsable">Responsable</option>
    <option value="admin" selected>Administrateur</option>
  </select>
  <span style="color:var(--mut)">Données : extrait réel de la base (85 fiches) ; devis, factures, comptes et rapports d'exemple. Aucune écriture en base.</span>
</div>
<nav class="tabs" id="tabs" aria-label="Écrans"></nav>
<main id="main"></main>
<footer>B-Clim@tik 1.2.0 — B-Form@tik · version connectée</footer>
<div id="modal"></div>
</div>

function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function head(tab, sub, acts = ''){
  return `<div class="screen-head"><div class="accent" style="background:${ACC[tab]}">${ICON[tab]}</div><div><h2>${esc(tab === 'demandes' && isAdmin() ? 'Modifications' : TAB_L[tab])}</h2><p class="sub">${sub}</p></div><div class="acts">${acts}</div></div>`;

function parseSteps(txt){
  if (!txt) return [];
  let t = String(txt).replace(/\r/g, '');
  t = t.replace(/([^\n])\s+(?=(?:\d{1,2}[.)]|[a-h]\))\s+\S)/g, '$1\n').replace(/([^\n])\s+(?=[•–]\s)/g, '$1\n');
  return t.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    let m = l.match(/^(\d{1,2})[.)]\s+(.*)$/); if (m) return {k:'num', n:m[1], t:m[2]};
    m = l.match(/^([a-h])\)\s+(.*)$/); if (m) return {k:'num', n:m[1], t:m[2]};
    m = l.match(/^[-•–]\s+(.*)$/); if (m) return {k:'pt', t:m[1]};
    if (/:$/.test(l) || (l.length < 60 && !/[.;]$/.test(l))) return {k:'sub', t:l.replace(/:$/, '')};
    return {k:'txt', t:l};
  });
}
function stepsHTML(txt, check){
  const st = parseSteps(txt); if (!st.length) return '';
  return `<ol class="steps">${st.map((s, i) => {
    if (s.k === 'sub') return `<li class="sub">${esc(s.t)}</li>`;
    if (s.k === 'pt') return `<li class="pt ${check ? 'nochk' : ''}"><span class="num">•</span><span class="txt">${esc(s.t)}</span></li>`;
    if (s.k === 'txt') return `<li class="${check ? 'nochk' : ''}"><span class="txt">${esc(s.t)}</span></li>`;
    const done = check && S.proc.checks[check + ':' + i];
    return `<li class="${done ? 'done' : ''}">${check ? `<input type="checkbox" data-chk="${check}:${i}" ${done ? 'checked' : ''} aria-label="Étape ${esc(s.n)} faite">` : ''}<span class="num">${esc(s.n)}</span><span class="txt">${esc(s.t)}</span></li>`;
  }).join('')}</ol>`;
}

/* ===== Écran 1 : Codes défauts ===== */
const DEF = () => FAULTS.filter(f => f.k === 'd');
function sysOf(f){ return f.sy || ''; }
function marquesFor(sys){
  const m = {}; DEF().filter(f => !sys || sysOf(f) === sys).forEach(f => m[f.m] = (m[f.m] || 0) + 1);
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
}
function refsFor(marque, sys){ return [...new Set(DEF().filter(f => f.m === marque && (!sys || sysOf(f) === sys)).map(f => f.r).filter(Boolean))].sort(); }
function matchCode(f, q){
  if (!q) return true;
  const n = norm(q);
  const cands = [f.c, f.sc != null ? `${f.c}-${f.sc}` : null].filter(Boolean).map(norm);
  if (cands.includes(n)) return true;
  if (n.length > 2 && norm(f.t).includes(n)) return true;
  return false;
}
function searchCodes(){
  const c = S.codes;
  return DEF().filter(f => matchCode(f, c.q)
    && (!c.sys || sysOf(f) === c.sys) && (!c.marque || f.m === c.marque)
    && (!c.ta || f.ta === c.ta) && (!c.ref || f.r === c.ref)
    && (!c.lieu || (f.ll || []).includes(c.lieu))
    && (!c.statut || (c.statut === 'v' ? f.v : !f.v))
    && (!c.nled || (f.leds || []).some(l => l.etat === 'clignote' && String(l.clignotements) === String(c.nled)))
    && (!c.timer || (f.leds || []).some(l => /timer|minuterie/i.test(l.nom || '') && l.etat === c.timer)));
}

    <div class="row">

      ${c.sys !== 'DRV / VRF' ? `<div><label class="f" for="cta">Type d'appareil</label><select class="inp" id="cta"><option value="">Tous</option>${['split','gainable','cassette','plafonnier','console','multi_split'].map(t => `<option value="${t}" ${c.ta === t ? 'selected' : ''}>${t.replace('_', '-').replace(/^./, x => x.toUpperCase())}</option>`).join('')}</select></div>` : ''}
      <div><label class="f" for="cr">Référence</label><select class="inp" id="cr" ${c.marque ? '' : 'disabled'}><option value="">${c.marque ? 'Toutes les références' : 'Choisir d’abord la marque'}</option>${refs.map(r => `<option ${c.ref === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}<option value="__autre">Ma référence n'est pas dans la liste</option></select></div>

  return html;
}
function codeResults(){
  const c = S.codes;
  if (!c.run) return `<div class="invite">${ICON.codes}<p><b>Saisissez un code défaut</b> ou choisissez une marque, puis appuyez sur Rechercher.</p><p style="font-size:14px">Le code seul suffit : les résultats sont groupés par marque et par référence.</p></div>`;

  const groups = {};

/* ===== Outils (Super Technicien, Responsable, Admin) ===== */
const PT = {}; R.pt.forEach(([f, t, b, r]) => (PT[f] = PT[f] || []).push([t, b, r]));
const FLUIDS = ['R32','R410A','R407C','R134a','R404A','R507A','R448A','R449A','R452A','R454B','R22','R290','R1234yf','R513A'];
const FINFO = Object.fromEntries(R.fluides.map(f => [f.nom, f]));
const T = {ct:'tri', r1:'', r2:'', r3:'', rn:'', iso1:'', iso2:'', iso3:'', i1:'', i2:'', i3:'', inom:'', f:'R410A', side:'bp', temp:'', pres:'', tube:'', target:'', bp:'', tasp:'', hp:'', tliq:'', surf:'25', haut:'2.5', expo:'50', toit:'1', pers:'2', vitre:'0', app:'0', table:false};
try { const f = localStorage.getItem('bclim_fluide'); if (f && PT[f]) T.f = f; } catch (e) {}
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
function pFromT(f, t, col){ const a = PT[f]; if (t < a[0][0] || t > a[a.length - 1][0]) return null; for (let i = 0; i < a.length - 1; i++) if (t >= a[i][0] && t <= a[i + 1][0]) { const k = (t - a[i][0]) / (a[i + 1][0] - a[i][0]); return a[i][col] + k * (a[i + 1][col] - a[i][col]); } return null; }
function tFromP(f, p, col){ const a = PT[f]; if (p < a[0][col] || p > a[a.length - 1][col]) return null; for (let i = 0; i < a.length - 1; i++) if (p >= a[i][col] && p <= a[i + 1][col]) { const k = (p - a[i][col]) / (a[i + 1][col] - a[i][col]); return a[i][0] + k * (a[i + 1][0] - a[i][0]); } return null; }
const fx = (n, d = 1) => n == null ? '—' : n.toLocaleString('fr-FR', {minimumFractionDigits:d, maximumFractionDigits:d});
function rTools(){
  const tabs = [['pt','Pression ↔ température'],['sh','Surchauffe'],['sr','Sous-refroidissement'],['cmp','Vérificateur compresseur'],['btu','Puissance BTU'],['bruit','Analyse de bruit']];
  let h = head('outils', 'Calculs de terrain hors ligne, à partir des tables pression / température de la base (bar relatif, −40 à +60 °C).');
  h += `<div class="seg" style="margin-bottom:12px">${tabs.map(([k, v]) => `<button type="button" class="${S.tool === k ? 'on' : ''}" data-tool="${k}">${v}</button>`).join('')}</div><div id="toolBody"></div>`;
  return h;
}
function fluBtns(){ return `<div class="flu" role="group" aria-label="Fluide">${FLUIDS.map(f => `<button type="button" class="${T.f === f ? 'on' : ''}" data-flu="${f}">${f}</button>`).join('')}</div>${FINFO[T.f] ? `<p style="font-size:13px;color:var(--mut);margin:6px 0 0">${esc(T.f)} : classe ${esc(FINFO[T.f].classe)}, GWP ${esc(FINFO[T.f].gwp)}${FINFO[T.f].zeo ? ', zéotrope (BP en rosée, HP en bulle)' : ''}. ${esc(FINFO[T.f].prec)}</p>` : ''}`; }
function field(id, lab, val, unit){ return `<div><label class="f" for="${id}">${lab}</label><div style="display:flex;gap:6px;align-items:center"><input class="inp" id="${id}" inputmode="decimal" value="${esc(val)}"><span style="white-space:nowrap">${unit}</span></div></div>`; }
function procLink(id, txt){ const p = byId(id); return p ? `<div class="panel" style="margin-top:14px"><h3>${esc(txt)}</h3>${stepsHTML(p.so)}<p class="meta">Fiche : ${esc(p.t)}</p></div>` : ''; }
function drawTool(){
  const b = $('#toolBody'); if (!b) return;
  if (S.tool === 'pt') {
    const col = T.side === 'bp' ? 2 : 1;
    const tv = num(T.temp), pv = num(T.pres), tu = num(T.tube), tg = num(T.target);
    const pRes = tv != null ? pFromT(T.f, tv, col) : null;
    const tSat = pv != null ? tFromP(T.f, pv, col) : null;
    let diag = '';
    if (tSat != null && tg != null) {

function drawGauge(p){

/* ===== Vérificateur compresseur ===== */
function cmpEval(){
  const mono = T.ct === 'mono', res = [];
  const R = [T.r1, T.r2, T.r3].map(v => /^(ol|inf|∞)$/i.test(String(v).trim()) ? Infinity : num(v));
  const ok = (b, t) => res.push([b ? 'ok' : 'ko', t]), warn = t => res.push(['av', t]);
  const lab = mono ? ['C-R', 'C-S', 'S-R'] : ['U-V', 'V-W', 'W-U'];
  if (R.every(v => v != null)) {
    R.forEach((v, i) => { if (v === Infinity) ok(false, `${lab[i]} infini : enroulement coupé${mono ? ' (ou klixon ouvert : laisser refroidir 1 h et remesurer)' : ''}.`); else if (v <= 0.01) ok(false, `${lab[i]} à ${fx(v, 2)} Ω : court-circuit.`); });
    if (R.every(v => v !== Infinity && v > 0.01)) {
      if (mono) {
        const [cr, cs, sr] = R, e = Math.abs(sr - (cr + cs)) / sr;
        ok(e <= .1, `S-R (${fx(sr, 2)} Ω) ${e <= .1 ? '=' : '≠'} C-S + C-R (${fx(cr + cs, 2)} Ω), écart ${fx(e * 100, 0)} %.`);
        ok(cs > cr, cs > cr ? 'C-S (démarrage) plus grand que C-R (marche) : cohérent.' : 'C-S n’est pas plus grand que C-R : bornes mal repérées ou enroulement défectueux.');
      } else {
        const m = R.reduce((a, b) => a + b) / 3, e = Math.max(...R.map(v => Math.abs(v - m) / m));
        if (e <= .05) ok(true, `Trois enroulements équilibrés (écart ${fx(e * 100, 1)} %).`);
        else if (e <= .10) warn(`Écart entre enroulements de ${fx(e * 100, 1)} % : à surveiller (limite 10 %).`);
        else ok(false, `Écart entre enroulements de ${fx(e * 100, 1)} % : enroulement défectueux.`);
      }
      const rn = num(T.rn);
      if (rn) { const ref = mono ? R[0] : R.reduce((a, b) => a + b) / 3, e = Math.abs(ref - rn) / rn; ok(e <= .1, `${mono ? 'C-R' : 'Moyenne'} ${fx(ref, 2)} Ω pour ${fx(rn, 2)} Ω constructeur : écart ${fx(e * 100, 0)} %${e <= .1 ? '' : ' (plus de 10 %)'}.`); }
    }
  }
  const I = [T.iso1, T.iso2, T.iso3].map(num).filter(v => v != null);
  if (I.length) { const mn = Math.min(...I); if (mn >= 1) ok(true, `Isolement à la masse : ${fx(mn, 1)} MΩ minimum (≥ 1 MΩ).`); else ok(false, `Isolement à la masse : ${fx(mn, 2)} MΩ (moins de 1 MΩ). Préchauffer le carter et remesurer avant de conclure.`); }
  const A = (mono ? [T.i1] : [T.i1, T.i2, T.i3]).map(num).filter(v => v != null), inom = num(T.inom);
  if (A.length) {
    if (!mono && A.length === 3) { const m = A.reduce((a, b) => a + b) / 3, e = Math.max(...A.map(v => Math.abs(v - m))) / m; ok(e <= .1, `Déséquilibre des courants : ${fx(e * 100, 1)} %${e <= .1 ? ' (≤ 10 %)' : ' (plus de 10 % : contrôler l’alimentation, les connexions et les enroulements)'}.`); }
    if (inom) { const mx = Math.max(...A), k = mx / inom; if (k > 1.1) ok(false, `Intensité ${fx(mx, 1)} A pour ${fx(inom, 1)} A nominal (${fx(k * 100, 0)} %) : surcharge. Contrôler HP, BP et tension.`); else if (k < .4) warn(`Intensité faible (${fx(k * 100, 0)} % du nominal) : si HP et BP ne s’écartent pas, le compresseur ne comprime pas.`); else ok(true, `Intensité ${fx(mx, 1)} A pour ${fx(inom, 1)} A nominal (${fx(k * 100, 0)} %).`); }
  }
  const ko = res.some(r => r[0] === 'ko'), av = res.some(r => r[0] === 'av');
  const enough = R.every(v => v != null);
  const verdict = !res.length ? null : ko ? ['ko', 'Compresseur défectueux'] : !enough ? ['av', 'Mesures incomplètes'] : av ? ['av', 'À surveiller'] : ['ok', 'Compresseur bon'];
  return {res, verdict};
}
function cmpHTML(){

   ${res.length ? res.map(r => `<div class="diag" style="background:${col[r[0]]}">${ic[r[0]]} ${esc(r[1])}</div>`).join('') : '<p style="color:var(--mut)">Saisissez au moins les trois résistances. Le verdict se met à jour à chaque saisie.</p>'}
   <p class="meta" style="margin-top:10px">Seuils : enroulements à 5 % (défaut au-delà de 10 %), S-R = C-S + C-R à 10 %, constructeur à 10 %, isolement 1 MΩ, déséquilibre 10 %, intensité 110 % de la plaque. La valeur du constructeur prime.</p></div></div>
   ${procLink('3237b748', 'Méthode de contrôle pas à pas')}`;

function similarRef(v){ const n = norm(v); const all = [...new Set(FAULTS.map(f => f.r).filter(Boolean))]; return all.find(r => norm(r).includes(n.slice(0, 5)) && n.length >= 5); }
async function addDocs(files){
  for (const f of files) {
    if (f.size > 10 * 1024 * 1024) { toast(`${f.name} : plus de 10 Mo, fichier refusé.`); continue; }
    const d = {name:f.name, type:f.type};
    if (f.type.startsWith('image/')) d.url = await new Promise(res => { const fr = new FileReader(); fr.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = img.width * k; cv.height = img.height * k; cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', .8)); }; img.onerror = () => res(fr.result); img.src = fr.result; }; fr.readAsDataURL(f); });
    if (FORM.mode === 'schema') FORM.docs = [d]; else FORM.docs.push(d);
  }
  const t = $('#thumbs'); if (t) t.innerHTML = thumbsHTML();
}
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-tab]'); if (!t) return;

const NZ_REG = {continu:'Continu', a_coups:'Par à-coups', rythme:'Rythmé'};
const lab = (L, k) => (L.find(x => x[0] === k) || [k, k])[1];

/* --- calcul : FFT radix 2 --- */
function fftMag(re){
  const n = re.length, im = new Float64Array(n);
  for (let i = 1, j = 0; i < n; i++) { let b = n >> 1; for (; j & b; b >>= 1) j ^= b; j ^= b; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; } }
  for (let len = 2; len <= n; len <<= 1) {
    const a = -2 * Math.PI / len, wr = Math.cos(a), wi = Math.sin(a);
    for (let i = 0; i < n; i += len) { let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) { const ur = re[i + k], ui = im[i + k], xr = re[i + k + len / 2], xi = im[i + k + len / 2];
        const vr = xr * cr - xi * ci, vi = xr * ci + xi * cr; re[i + k] = ur + vr; im[i + k] = ui + vi; re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
        const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t; } } }
  const m = new Float64Array(n / 2); for (let i = 0; i < n / 2; i++) m[i] = (re[i] * re[i] + im[i] * im[i]) / n; return m;
}
function analyseSon(x, sr){
  const N = 4096, hop = 2048, nb = N / 2, df = sr / N;
  const win = new Float64Array(N); for (let i = 0; i < N; i++) win[i] = .5 - .5 * Math.cos(2 * Math.PI * i / (N - 1));
  const frames = [], avg = new Float64Array(nb);
  for (let s = 0; s + N <= x.length; s += hop) { const b = new Float64Array(N); for (let i = 0; i < N; i++) b[i] = x[s + i] * win[i]; const m = fftMag(b); frames.push(m); for (let i = 0; i < nb; i++) avg[i] += m[i]; }
  if (!frames.length) throw new Error('Enregistrement trop court (moins de 0,1 s).');
  for (let i = 0; i < nb; i++) avg[i] /= frames.length;
  const db = Array.from(avg, v => 10 * Math.log10(v + 1e-12));
  const fmax = Math.min(sr / 2, 8000), imax = Math.floor(fmax / df), i20 = Math.ceil(20 / df);
  // pics
  const sm = db.map((v, i) => (db[i - 1] ?? v) * .25 + v * .5 + (db[i + 1] ?? v) * .25);
  const med = [...sm.slice(i20, imax)].sort((a, b) => a - b)[Math.floor((imax - i20) / 2)];
  const pk = [];
  for (let i = i20 + 1; i < imax - 1; i++) if (sm[i] > sm[i - 1] && sm[i] >= sm[i + 1] && sm[i] > med + 10) { const a = sm[i - 1], b = sm[i], c = sm[i + 1], p = .5 * (a - c) / (a - 2 * b + c || 1); pk.push({f:+((i + p) * df).toFixed(1), db:+b.toFixed(1)}); }
  pk.sort((a, b) => b.db - a.db);
  const pics = []; for (const p of pk) { if (pics.every(q => Math.abs(q.f - p.f) > 3 * df)) pics.push(p); if (pics.length === 6) break; }
  const fdom = pics.length ? pics[0].f : null;
  const near = f0 => pics.some(p => Math.abs(p.f - f0) <= Math.max(3, 1.5 * df));
  const secteur = (near(100) && (near(200) || near(50) || near(300))) || (near(50) && near(150));
  // bandes d'énergie
  const band = (a, b) => { let s = 0; for (let i = Math.ceil(a / df); i < Math.min(nb, b / df); i++) s += avg[i]; return s; };
  const B = {'<200 Hz':band(20, 200), '200-1000 Hz':band(200, 1000), '1-4 kHz':band(1000, 4000), '>4 kHz':band(4000, sr / 2)};
  const tot = Object.values(B).reduce((a, b) => a + b, 0) || 1; for (const k in B) B[k] = Math.round(B[k] / tot * 100);
  // niveau et régularité (enveloppe 20 ms)
  let ss = 0; for (const v of x) ss += v * v; const rms = Math.sqrt(ss / x.length), dbfs = +(20 * Math.log10(rms + 1e-9)).toFixed(1);
  const w = Math.round(sr * .02), env = []; for (let s = 0; s + w <= x.length; s += w) { let e = 0; for (let i = s; i < s + w; i++) e += x[i] * x[i]; env.push(Math.sqrt(e / w)); }
  const mE = env.reduce((a, b) => a + b, 0) / env.length, sd = Math.sqrt(env.reduce((a, b) => a + (b - mE) ** 2, 0) / env.length), cv = sd / (mE || 1);
  const srt = [...env].sort((a, b) => a - b), crest = srt[srt.length - 1] / (srt[Math.floor(srt.length / 2)] || 1e-9);
  let best = 0, lag = 0; const z = env.map(v => v - mE);
  for (let L = 5; L <= Math.min(150, env.length / 2); L++) { let a = 0, b = 0; for (let i = 0; i + L < z.length; i++) { a += z[i] * z[i + L]; b += z[i] * z[i]; } const r = a / (b || 1); if (r > best) { best = r; lag = L; } }
  // enveloppe des aigus (> 300 Hz) sur les trames STFT : fait ressortir les chocs masqués par un ronflement
  const i3 = Math.ceil(300 / df), hf = frames.map(m => { let e = 0; for (let i = i3; i < nb; i++) e += m[i]; return Math.sqrt(e); });
  const mH = hf.reduce((a, b) => a + b, 0) / hf.length, cvH = Math.sqrt(hf.reduce((a, b) => a + (b - mH) ** 2, 0) / hf.length) / (mH || 1);
  let bestH = 0, lagH = 0; const zH = hf.map(v => v - mH), dt = hop / sr;
  const rH = {}; for (let L = Math.max(2, Math.round(.1 / dt)); L <= Math.min(Math.round(3 / dt), hf.length / 2); L++) { let a = 0, b = 0; for (let i = 0; i + L < zH.length; i++) { a += zH[i] * zH[i + L]; b += zH[i] * zH[i]; } rH[L] = a / (b || 1); if (rH[L] > bestH) { bestH = rH[L]; lagH = L; } }
  for (const L of Object.keys(rH).map(Number).sort((a, b) => a - b)) if (rH[L] >= .8 * bestH && rH[L] >= (rH[L - 1] ?? -1) && rH[L] >= (rH[L + 1] ?? -1)) { lagH = L; break; }
  let reg = 'continu', per = null;
  if (cv > .15 && best > .45) { reg = 'rythme'; per = +(lag * .02).toFixed(2); } else if (cvH > .3 && bestH > .45) { reg = 'rythme'; per = +(lagH * dt).toFixed(2); } else if (crest > 4 || cv > .5 || cvH > .8) reg = 'a_coups';
  // spectre réduit (128 points, échelle log 20 Hz → fmax) pour le rapport et la base
  const spectre = []; for (let k = 0; k < 128; k++) { const f = 20 * Math.pow(fmax / 20, k / 127), i = Math.min(nb - 1, Math.round(f / df)); spectre.push([+f.toFixed(0), +db[i].toFixed(1)]); }
  return {sr, duree:+(x.length / sr).toFixed(1), frames, df, imax, fdom, pics, secteur, bandes:B, dbfs, reg, per, spectre};
}

/* --- graphiques --- */
function drawSpectro(cv, R){
  const W = 600, H = 220, ctx = cv.getContext('2d'); cv.width = W + 46; cv.height = H + 30;
  ctx.fillStyle = '#0b1626'; ctx.fillRect(0, 0, cv.width, cv.height);
  const fTop = Math.min(4000, R.imax * R.df), iTop = Math.floor(fTop / R.df);
  let mx = -1e9, mn = 1e9; R.frames.forEach(f => { for (let i = 1; i < iTop; i++) { const v = 10 * Math.log10(f[i] + 1e-12); if (v > mx) mx = v; if (v < mn) mn = v; } });
  mn = Math.max(mn, mx - 70);
  const img = ctx.createImageData(W, H);
  for (let xg = 0; xg < W; xg++) { const fr = R.frames[Math.floor(xg * R.frames.length / W)];
    for (let y = 0; y < H; y++) { const i = Math.max(1, Math.floor((H - 1 - y) / H * iTop)); const t = Math.min(1, Math.max(0, (10 * Math.log10(fr[i] + 1e-12) - mn) / (mx - mn)));
      const o = (y * W + xg) * 4; img.data[o] = 255 * Math.min(1, t * 1.6); img.data[o + 1] = 255 * Math.max(0, t * 1.4 - .45); img.data[o + 2] = 255 * (t < .35 ? .45 + t : Math.max(0, .9 - t)); img.data[o + 3] = 255; } }
  ctx.putImageData(img, 40, 4);
  ctx.fillStyle = '#c9d4e6'; ctx.font = '12px Nunito, sans-serif';
  [0, 1000, 2000, 3000, 4000].filter(f => f <= fTop).forEach(f => { const y = Math.max(14, 4 + H - f / fTop * H); ctx.fillText(f >= 1000 ? f / 1000 + ' k' : String(f), 4, f ? y + 4 : y); });
  ctx.fillText('Hz', 4, H + 22); ctx.fillText('temps → ' + String(R.duree).replace('.', ',') + ' s', 44, H + 22);
  return cv.toDataURL('image/png');
}
function spectreSVG(sp, fdom){
  const W = 560, H = 180, x0 = 40, y0 = 10, w = W - 50, h = H - 40, fmin = sp[0][0], fmax = sp[sp.length - 1][0];
  const vals = sp.map(p => p[1]), mx = Math.max(...vals), mn = Math.max(Math.min(...vals), mx - 60);
  const X = f => x0 + Math.log(f / fmin) / Math.log(fmax / fmin) * w, Y = v => y0 + (1 - (Math.max(v, mn) - mn) / (mx - mn || 1)) * h;
  const path = sp.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
  const ticks = [50, 100, 200, 500, 1000, 2000, 5000].filter(f => f >= fmin && f <= fmax);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto" role="img" aria-label="Spectre moyen du bruit">
  <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="var(--soft)"/>
  ${ticks.map(f => `<line x1="${X(f)}" x2="${X(f)}" y1="${y0}" y2="${y0 + h}" stroke="var(--line)"/><text x="${X(f)}" y="${y0 + h + 16}" font-size="12" text-anchor="middle" fill="currentColor">${f >= 1000 ? f / 1000 + ' k' : f}</text>`).join('')}
  <text x="${x0 + w}" y="${y0 + h + 30}" font-size="12" text-anchor="end" fill="currentColor">Fréquence (Hz)</text>
  <path d="${path}" fill="none" stroke="var(--or)" stroke-width="2.5"/>
  ${fdom ? `<line x1="${X(fdom)}" x2="${X(fdom)}" y1="${y0}" y2="${y0 + h}" stroke="var(--navy)" stroke-dasharray="4 3"/><text x="${X(fdom) + 4}" y="${y0 + 14}" font-size="12" fill="currentColor">${Math.round(fdom)} Hz</text>` : ''}
  <text x="4" y="${y0 + 12}" font-size="12" fill="currentColor">dB</text></svg>`;
}

/* --- hypothèses (règles locales ; dans la version réelle, l'IA les affine pour 1 UTI) --- */
function procsFor(words){ const P = FAULTS.filter(f => f.k === 'p' && f.m === 'Toutes marques'); const out = []; for (const w of words) { const n = norm(w); P.filter(p => norm(p.t).includes(n)).forEach(p => { if (!out.includes(p) && out.length < 3) out.push(p); }); } return out; }
function hypotheses(R){
  const H = [], s = NZ.src, b = R.bandes, add = (sc, t, v, kw) => H.push({sc, t, v, procs:procsFor(kw)});
  if (R.secteur) add(80, 'Bourdonnement électrique (raies à 100 Hz et multiples : réseau 50 Hz)', ['Contrôler le contacteur (bobine, contacts) et serrer les bornes.', 'Contrôler le transformateur et la tension d’alimentation.', 'Chercher une tôle ou un capot qui vibre (appuyer à la main).'], ['compresseur : enroulements', 'méthodologie']);
  if (R.reg === 'rythme' && R.per) { const tpm = Math.round(60 / R.per);
    add(s.startsWith('ventilateur') ? 85 : 55, `Bruit rythmé (période ${String(R.per).replace('.', ',')} s, environ ${tpm} coups par minute) : frottement, balourd ou roulement`, ['Couper et tourner l’hélice ou la turbine à la main : jeu, point dur, frottement.', 'Contrôler les roulements du moteur (bruit, jeu radial).', 'Vérifier la fixation de l’hélice sur l’arbre et l’état des pales.', 'Contrôler les plots antivibratoires.'], ['méthodologie']); }
  if (R.reg === 'a_coups') add(NZ.moment === 'demarrage' && s === 'compresseur' ? 85 : 55, 'Claquements ou à-coups : démarrage brutal, coup de liquide, supports', ['Observer le démarrage : claquement du contacteur ou du compresseur.', 'Contrôler la surchauffe à l’aspiration (risque de retour liquide si < 3 K).', 'Contrôler les supports et silentblocs du compresseur.', 'Vérifier la résistance de carter si l’appareil est resté à l’arrêt.'], ['surchauffe et le sous', 'compresseur : enroulements']);
  if (b['>4 kHz'] + b['1-4 kHz'] >= 55 && R.reg === 'continu') add(['detendeur', 'tuyauterie'].includes(s) ? 80 : 60, 'Sifflement (énergie dans les aigus) : fuite, détendeur, manque de fluide', ['Rechercher une fuite (détecteur, eau savonneuse) aux raccords et brasures.', 'Mesurer BP et surchauffe : surchauffe élevée = manque de fluide.', 'Contrôler le détendeur (bobine, ouverture).'], ['diagnostic des pannes', 'surchauffe et le sous', 'manomètre']);
  if (b['<200 Hz'] >= 45 && !R.secteur) add(['tuyauterie', 'carrosserie'].includes(s) ? 80 : 55, 'Vibration mécanique basse fréquence : fixations, tuyauteries, plots', ['Toucher les tuyauteries : vibration transmise au mur ou à la tôle.', 'Resserrer colliers, supports et capots.', 'Contrôler les plots antivibratoires et la mise à niveau de l’unité.'], ['méthodologie']);
  if (s === 'compresseur' && b['200-1000 Hz'] >= 40 && R.reg === 'continu') add(65, 'Bruit mécanique du compresseur (paliers, clapets)', ['Mesurer l’intensité et la comparer à la plaque.', 'Mesurer BP / HP : taux de compression anormal.', 'Contrôler les enroulements avec l’outil Vérificateur compresseur.'], ['compresseur : enroulements', 'diagnostic des pannes']);
  if ((s === 'detendeur' || s === 'tuyauterie') && R.reg !== 'continu') add(70, 'Gargouillis : manque de fluide, incondensables, mauvaise évacuation des condensats', ['Contrôler le voyant liquide (bulles).', 'Mesurer le sous-refroidissement : faible = manque de fluide.', 'Vérifier l’évacuation des condensats et la pompe de relevage.'], ['sous-refroidissement', 'diagnostic des pannes']);
  if (!H.length) add(30, 'Aucune signature nette', ['Refaire l’enregistrement plus près de la source, sans parler, 15 à 30 s.', 'Comparer appareil en marche et à l’arrêt.'], []);
  return H.sort((a, b) => b.sc - a.sc);
}

async function nzAnalyse(buf){
  NZ.busy = 'Analyse en cours…'; drawNoise();
  try {
    const AC = window.AudioContext || window.webkitAudioContext, ac = new AC();
    const au = await ac.decodeAudioData(buf); const ch = au.getChannelData(0), n = Math.min(ch.length, au.sampleRate * 30);
    const x = new Float32Array(n); for (let c = 0; c < au.numberOfChannels; c++) { const d = au.getChannelData(c); for (let i = 0; i < n; i++) x[i] += d[i] / au.numberOfChannels; }
    ac.close && ac.close();
    const R = analyseSon(x, au.sampleRate); R.hyp = hypotheses(R); NZ.res = R; NZ.busy = '';
  } catch (e) { NZ.busy = 'Analyse impossible : ' + (e.message || e) + ' Essayez un autre format (m4a, mp3, wav, webm).'; }
  drawNoise();
}
async function nzRecord(){
  if (!navigator.mediaDevices || !window.MediaRecorder) { NZ.busy = 'Enregistrement non disponible sur ce navigateur : utilisez « Importer un son ».'; return drawNoise(); }
  try {
    const st = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    const rec = new MediaRecorder(st), ch = []; rec.ondataavailable = e => e.data.size && ch.push(e.data);
    const stop = new Promise(r => rec.onstop = r); rec.start();
    let left = +NZ.dur; NZ.busy = `Enregistrement… ${left} s`; drawNoise();
    const tm = setInterval(() => { left--; const m = $('#nzMsg'); if (m) m.textContent = `Enregistrement… ${Math.max(left, 0)} s`; }, 1000);
    await new Promise(r => setTimeout(r, +NZ.dur * 1000)); clearInterval(tm); rec.stop(); await stop; st.getTracks().forEach(t => t.stop());
    NZ.audio = new Blob(ch, {type:rec.mimeType}); await nzAnalyse(await NZ.audio.arrayBuffer());
  } catch (e) { NZ.busy = 'Micro indisponible (' + (e.name || 'refus') + '). Autorisez le micro, ou utilisez « Importer un son » : le téléphone propose son enregistreur.'; drawNoise(); }
}

const NT = {suivi_alerte:'seuil', suivi_code:'code', suivi_muet:'muet', suivi_compte_rendu:'cr'};
const IUK = {consigne:'cons', t_reprise:'tr', t_soufflage:'ts', lev_int:'lev'};
let SURV = null;
let MDP = [];
function sysFromRow(e, units, params, last, hist, alerts, events, crs){
  const s = {id:e.id, nom:e.nom, client:e.client || '', lieu:e.lieu || '', marque:e.marque || '', modele:e.modele || '', fluide:e.fluide || '',
    mode:e.mode_collecte || 'technicien', passerelle:e.passerelle_type || '', delai:e.delai_alerte_min || 30, owner:e.proprietaire_id,
    etat:e.etat === 'inactif' ? 'ok' : (e.etat || 'ok'), last:e.derniere_donnee_at ? new Date(e.derniere_donnee_at) : new Date(e.created_at || Date.now()),
    ou:[], iu:[], jeton:'', crs:(crs || []).map(c => ({niveau:c.niveau || 'ok', synthese:c.synthese, anomalies:c.anomalies || [], reco:c.recommandations || [], date:new Date(c.envoye_le || c.created_at), by:c.auteur_id})),
    alerts:(alerts || []).map(a => ({id:a.id, type:a.type === 'code_defaut' ? 'code' : a.type, msg:a.detail || a.type, key:a.id, date:new Date(a.created_at), ack:!!a.acquittee_at})), hist:{}, live:true};
  const byUnit = {};
  (units || []).sort((a, b) => (a.ordre || 0) - (b.ordre || 0)).forEach(u => {
    const x = u.type === 'exterieure' ? {ad:u.adresse, nom:u.nom || u.adresse, v:{}} : {ad:u.adresse, nom:u.nom || u.adresse, on:false, cons:null, tr:null, ts:null, lev:null, code:''};
    (u.type === 'exterieure' ? s.ou : s.iu).push(x); byUnit[u.id] = x;
  });
  (params || []).forEach(p => {
    let x = p.unite_id ? byUnit[p.unite_id] : null;
    if (!x) { x = s.ou.find(o => o.ad === 'SYS'); if (!x) { x = {ad:'SYS', nom:'Système', v:{}}; s.ou.push(x); } }
    const val = last[p.id];
    if (x.v) x.v[p.code] = val == null ? null : val;
    else if (p.code === 'marche') x.on = val > 0; else if (IUK[p.code]) x[IUK[p.code]] = val == null ? null : val;
    if (hist[p.id]) s.hist[x.ad + ':' + p.code] = hist[p.id];
  });
  (events || []).filter(ev => !ev.disparu_at).forEach(ev => { const x = byUnit[ev.unite_id]; if (x && 'code' in x) x.code = ev.sous_code ? ev.code + '-' + ev.sous_code : ev.code; });
  return s;
}
async function loadSurv(uid){
  const since = new Date(Date.now() - 864e5).toISOString();
  const [eqs, cat] = await Promise.all([all('suivi_equipements', '*', 'created_at'), all('suivi_catalogue', 'code,libelle,unite,seuil_bas,seuil_haut')]);
  const ids = eqs.map(e => e.id);
  if (!ids.length) { SURV = {params:{}, sys:[]}; return {sys:[], notifs:await loadNotifs(uid), cat}; }
  const pick = async (t, cols, col) => { const {data, error} = await sb.from(t).select(cols).in(col, ids).limit(5000); if (error) throw new Error(t + ' : ' + error.message); return data; };
  const [units, params, alerts, events, crs] = await Promise.all([
    pick('suivi_unites', 'id,equipement_id,type,adresse,nom,ordre', 'equipement_id'),
    pick('suivi_parametres', 'id,equipement_id,unite_id,code,libelle,unite,seuil_bas,seuil_haut', 'equipement_id'),
    pick('suivi_alertes', 'id,equipement_id,type,detail,created_at,acquittee_at', 'equipement_id'),
    pick('suivi_evenements', 'id,equipement_id,unite_id,code,sous_code,apparu_at,disparu_at', 'equipement_id'),
    pick('suivi_comptes_rendus', 'id,equipement_id,auteur_id,niveau,synthese,anomalies,recommandations,envoye_le,created_at', 'equipement_id')]);
  const pids = params.map(p => p.id), last = {}, hist = {};
  for (let i = 0; i < pids.length; i += 100) {
    const {data, error} = await sb.from('suivi_releves').select('parametre_id,valeur,mesure_at').in('parametre_id', pids.slice(i, i + 100)).gte('mesure_at', since).order('mesure_at').limit(10000);
    if (error) throw new Error('relevés : ' + error.message);
    data.forEach(r => { (hist[r.parametre_id] = hist[r.parametre_id] || []).push([new Date(r.mesure_at), +r.valeur]); last[r.parametre_id] = +r.valeur; });
  }
  const g = (a, id) => a.filter(x => x.equipement_id === id);
  const sys = eqs.map(e => sysFromRow(e, g(units, e.id), g(params, e.id), last, hist, g(alerts, e.id).sort((a, b) => b.created_at.localeCompare(a.created_at)), g(events, e.id), g(crs, e.id).sort((a, b) => (b.envoye_le || '').localeCompare(a.envoye_le || ''))));
  SURV = {params:Object.fromEntries(params.map(p => [p.id, p])), sys, units:Object.fromEntries(units.map(u => [u.id, u]))};
  return {sys, notifs:await loadNotifs(uid), cat};
}
async function loadNotifs(uid){
  const {data} = await sb.from('notifications').select('id,user_id,type,message,created_at,lien').eq('user_id', uid).like('type', 'suivi%').order('created_at', {ascending:false}).limit(30);
  return (data || []).map(n => ({u:n.user_id, type:NT[n.type] || 'seuil', msg:n.message, date:new Date(n.created_at), sys:(n.lien || {}).equipement_id}));
}
function survDraw(){ if (window.__survDraw) window.__survDraw(); }
function startRealtime(uid){
  if (!SURV || !SURV.sys.length) return;
  sb.channel('surveillance')
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'suivi_releves'}, ({new:r}) => {
      const p = SURV.params[r.parametre_id]; if (!p) return; const s = SURV.sys.find(x => x.id === p.equipement_id); if (!s) return;
      const u = p.unite_id ? SURV.units[p.unite_id] : null, ad = u ? u.adresse : 'SYS';
      const x = s.ou.find(o => o.ad === ad) || s.iu.find(o => o.ad === ad); if (!x) return;
      if (x.v) x.v[p.code] = +r.valeur; else if (p.code === 'marche') x.on = r.valeur > 0; else if (IUK[p.code]) x[IUK[p.code]] = +r.valeur;
      const k = ad + ':' + p.code; (s.hist[k] = s.hist[k] || []).push([new Date(r.mesure_at), +r.valeur]);
      s.last = new Date(r.mesure_at); if (s.etat === 'muet') s.etat = 'ok'; survDraw(); })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'suivi_alertes'}, ({new:a}) => {
      const s = SURV.sys.find(x => x.id === a.equipement_id); if (!s) return;
      s.alerts.unshift({id:a.id, type:a.type === 'code_defaut' ? 'code' : a.type, msg:a.detail || a.type, key:a.id, date:new Date(a.created_at), ack:false});
      s.etat = a.type === 'muet' ? 'muet' : 'alerte'; survDraw(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'suivi_evenements'}, ({new:ev}) => {
      const s = ev && SURV.sys.find(x => x.id === ev.equipement_id); if (!s) return; const u = SURV.units[ev.unite_id]; if (!u) return;
      const x = s.iu.find(o => o.ad === u.adresse); if (x) x.code = ev.disparu_at ? '' : (ev.sous_code ? ev.code + '-' + ev.sous_code : ev.code); survDraw(); })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'notifications', filter:'user_id=eq.' + uid}, ({new:n}) => {
      if (!String(n.type).startsWith('suivi') || !window.__notifs) return;
      window.__notifs.unshift({u:n.user_id, type:NT[n.type] || 'seuil', msg:n.message, date:new Date(n.created_at), sys:(n.lien || {}).equipement_id}); survDraw(); })
    .subscribe();
}
async function survSend(s){
  const raw = window.__svRaw ? window.__svRaw() : null, cr = window.__svCr ? window.__svCr() : null;
  if (!raw || !cr) return;
  const mesures = [], evenements = [];
  raw.forEach(([d, u, k, v]) => { const t = new Date(String(d).replace(' ', 'T')); const at = isNaN(t) ? null : t.toISOString();
    if (/^code$/i.test(k)) { const [c, sc] = String(v).split('-'); evenements.push({unite:u, code:c, sous_code:sc || null, apparu_at:at}); }
    else mesures.push({unite:u, code:k, valeur:String(v).replace(',', '.'), mesure_at:at}); });
  const imp = await sb.rpc('suivi_importer', {p_equipement:s.id, p_format:'csv', p:{mesures, evenements}});
  if (imp.error) return fail('Transfert refusé : ' + imp.error.message);
  const i = Array.isArray(imp.data) ? imp.data[0] : imp.data;
  const res = await sb.rpc('suivi_envoyer_compte_rendu', {p_equipement:s.id, p:{import_id:i && i.id, periode_debut:i && i.periode_debut, periode_fin:i && i.periode_fin, niveau:cr.niveau, synthese:cr.synthese, anomalies:cr.anomalies, recommandations:cr.reco}});
  if (res.error) return fail('Compte rendu non envoyé : ' + res.error.message);
  ok(`${mesures.length} mesures et ${evenements.length} code(s) enregistrés ; compte rendu envoyé au Responsable et à l’Admin.`);
  const fresh = await loadSurv((await sb.auth.getUser()).data.user.id);
  if (window.__survReload) window.__survReload(fresh);
}

/* ---------- Écran de connexion ---------- */
function showLogin(msg){
  $('#liveGate').hidden = false; $('#liveApp').hidden = true;
  $('#lgMsg').textContent = msg || '';
}
async function doLogin(ev){
  ev.preventDefault();
  const login = $('#lgEmail').value.trim(), pw = $('#lgPw').value;
  if (!login || !pw) { $('#lgMsg').textContent = 'Saisissez votre nom d’utilisateur et votre mot de passe.'; return; }
  if (login.includes('@')) { $('#lgMsg').textContent = 'La connexion se fait avec votre nom d’utilisateur (ex. J97139bour), pas avec l’adresse e-mail.'; return; }
  $('#lgBtn').disabled = true; $('#lgMsg').textContent = 'Connexion…';
  const r = await sb.rpc('email_de_connexion', {p_identifiant:login});
  const email = r.data;
  const {error} = email ? await sb.auth.signInWithPassword({email, password:pw}) : {error:{message:'Invalid login credentials'}};
  $('#lgBtn').disabled = false;
  if (error) { $('#lgMsg').textContent = error.message === 'Invalid login credentials' ? 'Nom d’utilisateur ou mot de passe incorrect.' : error.message; return; }
  boot();
}
async function doReset(){
  const login = $('#lgEmail').value.trim();
  if (!login) { $('#lgMsg').textContent = 'Saisissez d’abord votre nom d’utilisateur, puis cliquez à nouveau.'; return; }
  const {error} = await sb.rpc('demander_mot_de_passe', {p_identifiant:login, p_message:null});
  $('#lgMsg').textContent = error ? 'Demande non transmise : ' + error.message : 'Demande transmise à B-Form@tik. Après vérification de votre contrat, un nouveau mot de passe vous sera communiqué (2,95 €).';
}

/* ---------- Chargement ---------- */
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if (!session) { showLogin(); return; }
  $('#liveGate').hidden = false; $('#lgForm').hidden = true; $('#lgMsg').textContent = 'Chargement de vos données…';
  try {
    const uid = session.user.id;
    const {data:p, error:pe} = await sb.from('profiles').select('*').eq('id', uid).single();
    if (pe) throw new Error('profil : ' + pe.message);
    let type = p.type_compte || (p.role === 'ADMIN' ? 'admin' : 'technicien');
    if (type === 'gerant') type = 'responsable';            // Gérant = Responsable (même compte)
    if (!['demo','technicien','super_technicien','responsable','admin'].includes(type)) throw new Error('type de compte « ' + type + ' » non pris en charge par l’application.');

    const nom = [p.prenom, p.nom].filter(Boolean).join(' ') || p.full_name || p.email;
    const meAcc = {id:uid, type, nom, email:p.email, login:p.identifiant || '', secours:p.email_secours || '', ent:p.company_name || '', fin:p.valide_jusqu_au ? new Date(p.valide_jusqu_au) : null};

    const [faults, links, schemas, fluides, pt] = await Promise.all([
      all('climdiag_faults', 'id,kind,marque,reference,code,sous_code,titre,categorie,cause,solution,note,source,systeme,gamme,module,unite_concernee,lieu_lecture,lecture_detail,categorie_code,leds,type_appareil,led_mode,fluide,modele,clignotements,reference_id,statut_verification', 'marque'),
      type === 'demo' ? [] : all('climdiag_fault_procedures', 'fault_id,procedure_id,role,ordre'),
      type === 'demo' ? [] : all('climdiag_schemas', 'id,marque,gamme,reference,type_schema,titre,description,source_document,source_page,statut,image_path'),
      all('climdiag_fluides', 'nom,classe_securite,gwp,zeotrope,huile,mode_charge,precautions'),
      all('climdiag_fluides_pt', 'fluide,temperature_c,p_bulle_bar_rel,p_rosee_bar_rel', 'fluide')

    const F = faults.map(toShort);
    const schUrls = {}; const sp = schemas.map(x => x.image_path).filter(Boolean);
    if (sp.length) { const r = await sb.storage.from('climdiag-images').createSignedUrls(sp, 86400); (r.data || []).forEach(u => { if (u.signedUrl) schUrls[u.path] = u.signedUrl; }); }

    window.__F = F;
    window.__R = {
      links: links.map(l => [l.fault_id, l.procedure_id, l.role, l.ordre ?? 1]),
      schemas: schemas.map(s => ({id:s.id, m:s.marque, g:s.gamme || '', r:s.reference || '', ty:s.type_schema, t:s.titre, d:s.description || '', sd:s.source_document || '', sp:s.source_page || '', st:s.statut || '', img:s.image_path || '', url:schUrls[s.image_path] || ''})),
      fluides: fluides.map(f => ({nom:f.nom, classe:f.classe_securite, gwp:f.gwp, zeo:f.zeotrope, huile:f.huile, charge:f.mode_charge, prec:f.precautions})),
      pt: pt.map(x => [x.fluide, +x.temperature_c, +x.p_bulle_bar_rel, +x.p_rosee_bar_rel]),
      stats: Object.values(stats).sort((a, b) => b[1] - a[1])
    };

    /* Demandes de modification : les siennes, ou toutes pour l'admin */
    const props = await all('proposals', 'id,user_id,type,target_fault_id,content,content_avant,message,status,created_at,commentaire_admin', 'created_at');
    let accounts = [meAcc];

    const team = {};

    }
    const noises = type === 'demo' ? [] : await loadNoises();
    const surv = type === 'demo' ? {sys:[], notifs:[], cat:[]} : await loadSurv(uid);
    const accName = id => (accounts.find(a => a.id === id) || {}).nom || '';
    const PAY = {stripe:'Carte (Stripe)', paypal:'PayPal', virement:'Virement Qonto'};

      invoices: invoices.reverse().map(i => ({id:i.id, num:i.invoice_number, status:i.status, date:new Date(i.issued_at), who:i.user_id, client:accName(i.user_id) || '—', desc:i.description || '', amount:+i.amount, pay:PAY[i.payment_provider] || 'À choisir'})),

        const row = {user_id:uid, type:p.type, target_fault_id:p.target, content:toCols(p.content), content_avant:p.avant ? toCols(p.avant) : null, message:p.msg || null, status:'pending'};
        const {data, error} = await sb.from('proposals').insert(row).select('id').single();

      async updateProp(p){

        if (error) fail('Correction non enregistrée : ' + error.message);
      },
      async decide(p){

      async saveFault(d, mode, quiet){

          const {error} = await sb.from('climdiag_faults').update(row).eq('id', d.id);
          if (error) return fail('Fiche non enregistrée : ' + error.message);
        } else {
          row.statut_verification = 'a_verifier';

        }

        return true;

        <label class="btn sec" style="display:inline-flex;align-items:center;gap:6px;margin-top:6px">Ajouter des photos

      },
      /* ----- Comptes ----- */
      async createAccount(a){
        const {data, error} = await sb.rpc('admin_creer_utilisateur', {p_type:a.type, p_prenom:a.prenom, p_nom:a.nom, p_email:a.email, p_email_secours:a.secours || null,
          p_telephone:a.tel || null, p_code_postal:a.cp, p_localisation:a.loc || null, p_entreprise:a.ent || null, p_duree:a.duree});
        if (error) { fail('Compte non créé : ' + error.message); return null; }
        const x = Array.isArray(data) ? data[0] : data; ok('Compte créé dans la base.'); return x;
      },
      async extendAccount(id, duree){
        const {data, error} = await sb.rpc('admin_prolonger_compte', {p_user_id:id, p_duree:duree});
        if (error) { fail('Prolongation refusée : ' + error.message); return null; }
        ok('Compte prolongé.'); return data;
      },
      async defineTeam(n, ids){
        const {data, error} = await sb.rpc('responsable_definir_equipe', {p_nombre:n, p_identifiants:ids});
        if (error) { fail('Équipe non enregistrée : ' + error.message); return null; }
        return data;
      },
      /* ----- Devis et factures (admin) ----- */
      async createQuote(q){
        const lines = q.lines.map(l => ({designation:l[0], quantite:l[1], prix_unitaire:l[2], total:l[1] * l[2]}));
        const {data, error} = await sb.rpc('admin_create_quote', {p_client_name:q.client, p_client_email:q.email || null, p_description:q.desc || null, p_lines:lines, p_amount:lines.reduce((s, l) => s + l.total, 0), p_valid_until:q.valid ? q.valid.toISOString().slice(0, 10) : null});
        if (error) return fail('Devis non enregistré : ' + error.message);
        const x = Array.isArray(data) ? data[0] : data; q.id = x.id; q.num = x.quote_number; ok('Devis ' + x.quote_number + ' enregistré.'); if (window.__rerender) window.__rerender(); return true;
      },
      async quoteStatus(q){
        const {error} = q.status === 'envoye' ? await sb.rpc('admin_send_quote', {p_quote_id:q.id}) : await sb.from('quotes').update({status:q.status, decided_at:new Date().toISOString()}).eq('id', q.id);
        if (error) fail('Statut non enregistré : ' + error.message);
      },
      async convertQuote(q, inv){
        const {data, error} = await sb.rpc('admin_convert_quote_to_invoice', {p_quote_id:q.id, p_status:'pending'});
        if (error) return fail('Facture non créée : ' + error.message);
        const x = Array.isArray(data) ? data[0] : data; inv.id = x.invoice_id; inv.num = x.invoice_number; q.inv = x.invoice_number;
        ok('Facture ' + x.invoice_number + ' créée.'); if (window.__rerender) window.__rerender(); return true;
      },
      async markPaid(i){
        const {error} = await sb.from('invoices').update({status:'paid'}).eq('id', i.id);
        if (error) fail('Paiement non enregistré : ' + error.message); else ok('Paiement enregistré dans la base.');
      },
      /* ----- Surveillance ----- */
      survAction(d, s){
        if (d.svsim) { ok('Les essais (pannes simulées) restent dans la maquette : ici on ne travaille que sur des données réelles.'); return true; }
        if (!s) return false;
        if (d.svack) { const a = s.alerts.find(x => x.id === d.svack); if (!a) return true;
          sb.rpc('suivi_acquitter', {p_alerte:a.id}).then(({error}) => { if (error) return fail('Acquittement refusé : ' + error.message); a.ack = true; if (!s.alerts.some(x => !x.ack)) s.etat = 'ok'; ok('Alerte acquittée.'); survDraw(); }); return true; }
        if (d.svgw === 'on') { const mode = s.mode === 'technicien' ? 'mixte' : s.mode, gw = $('#sv_gwt').value, del = +$('#sv_del').value;
          sb.from('suivi_equipements').update({mode_collecte:mode, passerelle_type:gw, delai_alerte_min:del}).eq('id', s.id).then(({error}) => { if (error) return fail('Réglage non enregistré : ' + error.message); s.mode = mode; s.passerelle = gw; s.delai = del; ok('Passerelle activée : les données arriveront dès que le boîtier émet.'); if (window.__rerender) window.__rerender(); }); return true; }
        if (d.svgw === 'jeton') { sb.rpc('suivi_generer_jeton', {p_equipement:s.id}).then(({data, error}) => { if (error) return fail('Jeton non créé : ' + error.message); s.jeton = data; if (window.__survCollect) window.__survCollect(); }); return true; }
        if (d.svsend) { survSend(s); return true; }
        return false;
      },
      async addEquipment(e){
        const {data, error} = await sb.from('suivi_equipements').insert({nom:e.nom, client:e.client || null, lieu:e.lieu || null, systeme:'DRV / VRF', marque:e.marque || null, modele:e.modele || null, fluide:e.fluide || null, mode_collecte:e.mode || 'technicien', proprietaire_id:uid}).select('*').single();
        if (error) { fail('Équipement non créé : ' + error.message); return null; }
        ok('Équipement créé.'); return sysFromRow(data, [], [], {}, [], [], []);
      },
      /* ----- Analyse de bruit (base commune) ----- */
      async saveNoise(a, audio, nz){
        const {data:{user}} = await sb.auth.getUser(), base = `${user.id}/${Date.now()}`;
        let png = null, snd = null;
        try { if (a.img && a.img.startsWith('data:')) { const b = await (await fetch(a.img)).blob(); const up = await sb.storage.from('analyses-bruit').upload(base + '.png', b, {contentType:'image/png'}); if (!up.error) png = base + '.png'; } } catch (e) {}
        try { if (audio) { const ext = /mp4|m4a/.test(audio.type) ? 'm4a' : /wav/.test(audio.type) ? 'wav' : /ogg/.test(audio.type) ? 'ogg' : 'webm'; const up = await sb.storage.from('analyses-bruit').upload(base + '.' + ext, audio, {contentType:audio.type || 'audio/webm'}); if (!up.error) snd = base + '.' + ext; } } catch (e) {}
        const ids = [...new Set((a.hyp || []).flatMap(h => h.procs || []).filter(isUuid))];
        const {data, error} = await sb.rpc('enregistrer_analyse_bruit', {p:{rapport_id:isUuid(a.rap) ? a.rap : null, systeme:a.sys, marque:nz.marque || null, modele:nz.modele || null,
          source_bruit:a.src, mode:a.mode, moment:a.moment, description:a.desc || null, duree_s:+nz.dur || null, freq_dominante_hz:a.fdom || null, pics:a.pics || [],
          ronflement_secteur:!!a.secteur, bandes:a.bandes || {}, niveau_dbfs:a.dbfs ?? null, regularite:a.reg || null, periode_s:a.per || null, spectre:a.spectre || null,
          spectrogramme_path:png, audio_path:snd, hypotheses:a.hyp || [], fault_ids:ids}});
        if (error) return fail('Analyse non enregistrée : ' + error.message);
        const x = Array.isArray(data) ? data[0] : data; if (x && x.id) a.id = x.id;
        ok('Analyse de bruit enregistrée dans la base commune.');
      },
      /* ----- Schémas (image téléversée par l'admin) ----- */
      async saveSchema(x, doc){
        let path = x.img || null;
        if (doc && doc.url && doc.url.startsWith('data:')) {
          const b = await (await fetch(doc.url)).blob();
          path = `schemas/${Date.now()}-${(doc.name || 'schema').replace(/[^A-Za-z0-9._-]/g, '_')}`.replace(/\.[a-z]+$/i, '') + '.jpg';
          const up = await sb.storage.from('climdiag-images').upload(path, b, {contentType:b.type || 'image/jpeg', upsert:true});
          if (up.error) return fail('Image non envoyée : ' + up.error.message);
        }
        const row = {titre:x.t, type_schema:x.ty, marque:x.m || 'Toutes marques', reference:x.r || null, description:x.d || null, source_document:x.sd || null, statut:x.st || 'a_verifier', image_path:path};
        const res = isUuid(x.id) ? await sb.from('climdiag_schemas').update(row).eq('id', x.id).select('id').single() : await sb.from('climdiag_schemas').insert(row).select('id').single();
        if (res.error) return fail('Schéma non enregistré : ' + res.error.message);
        x.id = res.data.id; x.img = path;
        const su = path ? await sb.storage.from('climdiag-images').createSignedUrl(path, 86400) : null; if (su && su.data) x.url = su.data.signedUrl;
        ok('Schéma et image enregistrés dans la base.'); if (window.__rerender) window.__rerender();
      },
      mdpPanel(){
        if (!MDP.length) return '<div class="panel" style="margin-top:12px"><h3 style="margin-top:0">Demandes de mot de passe</h3><p class="meta">Aucune demande en attente.</p></div>';
        return `<div class="panel" style="margin-top:12px"><h3 style="margin-top:0">Demandes de mot de passe (${MDP.length})</h3><table>${MDP.map(d => `<tr><td><b>${esc(d.identifiant)}</b><br><span class="meta">${new Date(d.created_at).toLocaleString('fr-FR')}</span></td><td><button type="button" class="btn" data-mdp="${esc(d.user_id)}" data-mdpd="${esc(d.id)}">Vérifier et régénérer (2,95 €)</button></td></tr>`).join('')}</table></div>`;
      },
      async logout(){ await sb.auth.signOut(); location.reload(); }
    };
    $('#liveGate').hidden = true; $('#liveApp').hidden = false;
    window.__startApp();
    startRealtime(uid);
  } catch (e) {
    $('#lgForm').hidden = false;
    showLogin('Impossible d’ouvrir la session : ' + e.message);
  }
}
function ok(m){ if (window.toastLive) window.toastLive(m); }
function fail(m){ if (window.toastLive) window.toastLive(m, true); else console.error(m); return false; }

/* Mot de passe temporaire : changement obligatoire à la première connexion */
function askNewPassword(){
  $('#liveGate').hidden = false; $('#lgForm').hidden = true;
  $('#lgNew').hidden = false; $('#lgMsg').textContent = 'Première connexion : choisissez votre mot de passe définitif.';
}
async function saveNewPassword(ev){
  ev.preventDefault();
  const a = $('#np1').value, b = $('#np2').value;
  if (a.length < 8) { $('#lgMsg').textContent = 'Au moins 8 caractères.'; return; }
  if (a !== b) { $('#lgMsg').textContent = 'Les deux saisies sont différentes.'; return; }
  const {error} = await sb.auth.updateUser({password:a});
  if (error) { $('#lgMsg').textContent = error.message; return; }
  const {data:{user}} = await sb.auth.getUser();
  await sb.from('profiles').update({must_change_password:false}).eq('id', user.id);
  $('#lgNew').hidden = true; boot();
}

document.addEventListener('DOMContentLoaded', () => {
  $('#lgForm').addEventListener('submit', doLogin);
  $('#lgNew').addEventListener('submit', saveNewPassword);
  $('#lgReset').addEventListener('click', doReset);
  boot();
});
})();

</script>
</body>
